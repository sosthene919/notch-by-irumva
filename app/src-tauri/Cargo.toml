[package]
name = "notch"
version = "0.1.0"
description = "Notch by IRUMVA — a Dynamic Island for Windows 11"
authors = ["IRUMVA Sosthene"]
license = "MIT"
edition = "2021"

[lib]
name = "notch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
# Version matched to the one Tauri 2.12 resolves (windows 0.62.2 in Cargo.lock).
windows = { version = "0.62", features = ["Media_Control", "Foundation", "Storage_Streams", "Win32_Foundation", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com"] }
windows-core = "0.62"
