name: Release installer

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Build installer
        working-directory: app
        run: |
          npm ci
          npm run tauri build

      - name: Create checksums
        shell: pwsh
        run: |
          $setup = Get-ChildItem 'app/src-tauri/target/release/bundle/nsis/*.exe' | Select-Object -First 1
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($setup.Name)" | Set-Content -Encoding ASCII SHA256SUMS.txt

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body_path: marketing/release-notes-1.2.6.md
          files: |
            app/src-tauri/target/release/bundle/nsis/*.exe
            SHA256SUMS.txt
